spring:
  application:
    name: lufeng-chat
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    # 默认端口 3307：database/docker-compose.yml 里 MySQL 默认映射到宿主机 3307（3306 常被本机服务占用）。
    # 生产或其他端口一律用 SPRING_DATASOURCE_URL 覆盖，不要改这里的默认值。
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3307/lufeng_chat?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true}
    username: ${SPRING_DATASOURCE_USERNAME:lufeng}
    password: ${SPRING_DATASOURCE_PASSWORD:lufeng123456}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: ${SERVER_PORT:3001}

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: 'null'
  mapper-locations: classpath*:mapper/**/*.xml

lufeng:
  jwt:
    # 生产环境必须通过环境变量 JWT_SECRET 注入，且长度 >= 32 字节
    secret: ${JWT_SECRET:lufeng-dev-secret-please-change-in-production-0123456789}
    access-ttl: ${JWT_ACCESS_TTL:7200s}
    refresh-ttl: ${JWT_REFRESH_TTL:30d}
  ws:
    heartbeat-interval-ms: 25000
    idle-timeout-ms: 90000
    max-text-message-size: 65536
    # 多实例部署时置为 true：跨节点 WS 投递走 Redis Pub/Sub
    cluster-enabled: ${WS_CLUSTER_ENABLED:false}
  security:
    login-max-fail: 5
    login-lock-seconds: 300
    send-message-rate-per-minute: 60

logging:
  level:
    com.study.chat: info
    org.springframework.web.socket: warn
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X:requestId] %logger{36} - %msg%n'
